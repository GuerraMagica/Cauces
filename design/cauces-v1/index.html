<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'">
<title>Cauces — Design review</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f0f4f2;background:#0b1114;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:30px 28px 36px}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}h1{font-size:19px;font-weight:500;margin:0 0 7px;letter-spacing:-.4px}p{color:#a7b5b8;font-size:13px;margin:0;line-height:1.6}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.states,.directions{display:flex;flex-wrap:wrap;gap:5px}button{font:inherit;font-size:12px;color:#b4c1c4;border:1px solid #334047;background:#172025;border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{color:#f0f4f2;border-color:#7d989b}button:focus-visible,a:focus-visible{outline:2px solid #a7e2d2;outline-offset:4px}button[aria-pressed="true"]{color:#e2f4ee;background:#284339;border-color:#70b69f}.canvas{position:relative;width:100%;max-width:1000px;margin:auto;line-height:0;box-shadow:0 22px 80px #0005;border-radius:18px;overflow:hidden}.canvas img{display:block;width:100%;height:auto}.hotspot{position:absolute;background:transparent;border:0;padding:0;border-radius:10px}.hotspot:hover{background:#ffffff0a}.hotspot:focus-visible{outline:2px solid #a7e2d2;outline-offset:3px}.after{display:flex;justify-content:space-between;gap:20px;margin:20px auto 0;max-width:1000px;align-items:center}.after p{max-width:700px}a{color:#b4e6d7;text-decoration:none;font-size:12px}a:hover{text-decoration:underline}.note{font-size:12px;color:#93a3a8}.right{text-align:right}@media(max-width:760px){body{padding:20px 12px}header{align-items:flex-start;flex-direction:column}.toolbar{gap:12px}.states button{padding:7px 9px}.after{align-items:flex-start;flex-direction:column}.right{text-align:left}}
</style>
</head>
<body><main>
<header><div><h1>Cauces / Design review</h1><p>Flow concept and an editable template for a graphic designer.</p></div><p class="right">Concept draft<br><span class="note">Synthetic UI content · No audio processing</span></p></header>
<div class="toolbar"><div class="states" role="group" aria-label="Screen state">
<button type="button" data-state="empty" aria-pressed="true">Start</button><button type="button" data-state="ready" aria-pressed="false">Ready</button><button type="button" data-state="processing" aria-pressed="false">Separating</button><button type="button" data-state="review" aria-pressed="false">Review</button><button type="button" data-state="exported" aria-pressed="false">Exported</button><button type="button" data-state="error" aria-pressed="false">Error</button>
</div><div class="directions" role="group" aria-label="Visual direction"><button type="button" data-theme="proposal" aria-pressed="true">Flow concept</button><button type="button" data-theme="templates" aria-pressed="false">Designer template</button></div></div>
<div class="canvas" id="canvas"><img id="screen" src="proposal/empty.svg" alt="Cauces, Start state, Flow concept" width="1000" height="700"><div id="hotspots"></div></div>
<div class="after"><p id="hint" aria-live="polite">Click Open audio in the mock-up to view the next state. No files are opened.</p><a href="START-HERE.md">Designer handoff notes ↗</a></div>
</main>
<script>
(()=>{'use strict';let state='empty',theme='proposal';const image=document.getElementById('screen'),hotspots=document.getElementById('hotspots'),hint=document.getElementById('hint');
const labels={empty:'Start',ready:'Ready',processing:'Separating',review:'Review',exported:'Exported',error:'Error'};
const hints={empty:'Click Open audio in the mock-up to view the next state. No files are opened.',ready:'A synthetic file is ready. Click Separate voices to view the processing state.',processing:'Static progress example. Select Review above to inspect the completed state.',review:'Click Export audio to view the confirmation state. Playback controls are visual samples.',exported:'Export confirmation example. No files have been written.',error:'Example error state. Click Open audio to return to a valid sample file.'};
const actions={empty:[[416,427,168,44,'Open audio','ready']],ready:[[408,426,184,44,'Separate voices','processing']],processing:[[448,474,104,44,'Cancel','ready']],review:[[48,499,164,44,'Separate again','processing'],[768,499,184,44,'Export audio','exported']],exported:[[48,499,164,44,'Separate again','processing'],[768,499,184,44,'Export audio','exported']],error:[[416,432,168,44,'Open audio','ready']]};
function render(){image.src=theme+'/'+state+'.svg';image.alt='Cauces, '+labels[state]+' state, '+(theme==='proposal'?'Flow concept':'neutral designer template');hint.textContent=hints[state];document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));hotspots.replaceChildren();for(const [x,y,w,h,label,next] of actions[state]){const b=document.createElement('button');b.type='button';b.className='hotspot';b.setAttribute('aria-label',label+' (design preview)');Object.assign(b.style,{left:x/10+'%',top:y/7+'%',width:w/10+'%',height:h/7+'%'});b.addEventListener('click',()=>{state=next;render()});hotspots.append(b);}}
document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.state;render()}));document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;render()}));render();})();
</script>
</body></html>
