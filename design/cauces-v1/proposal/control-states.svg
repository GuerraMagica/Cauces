<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="svg-title" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title id="svg-title">Cauces control state reference</title><metadata>Editable design proposal for Cauces. Synthetic UI content. No audio processing. Copyright GuerraMagica Audio. Branding is provisional.</metadata><rect x="0" y="0" width="1000" height="490" rx="18" fill="#101619" /><text x="48" y="60" fill="#F0F4F2" font-size="23" font-weight="500" text-anchor="start" >Controls / interaction states</text><text x="48" y="90" fill="#A7B5B8" font-size="13" font-weight="400" text-anchor="start" >Reference for native SwiftUI controls</text><text x="48" y="132" fill="#A7B5B8" font-size="12" font-weight="400" text-anchor="start" >Default</text><g id="control-0" data-layer="control-0"><rect x="48" y="151" width="164" height="44" rx="10" fill="#A7E2D2" /><text x="130.0" y="178" fill="#102721" font-size="15" font-weight="600" text-anchor="middle" >Open audio…</text></g><text x="234" y="132" fill="#A7B5B8" font-size="12" font-weight="400" text-anchor="start" >Hover</text><g id="control-1" data-layer="control-1"><rect x="234" y="151" width="164" height="44" rx="10" fill="#B9EBDD" /><text x="316.0" y="178" fill="#102721" font-size="15" font-weight="600" text-anchor="middle" >Open audio…</text></g><text x="420" y="132" fill="#A7B5B8" font-size="12" font-weight="400" text-anchor="start" >Pressed</text><g id="control-2" data-layer="control-2"><rect x="420" y="151" width="164" height="44" rx="10" fill="#8ECBB9" /><text x="502.0" y="178" fill="#102721" font-size="15" font-weight="600" text-anchor="middle" >Open audio…</text></g><text x="606" y="132" fill="#A7B5B8" font-size="12" font-weight="400" text-anchor="start" >Disabled</text><g id="control-3" data-layer="control-3"><rect x="606" y="151" width="164" height="44" rx="10" fill="#202B30" /><text x="688.0" y="178" fill="#93A3A8" font-size="15" font-weight="600" text-anchor="middle" >Open audio…</text></g><text x="792" y="132" fill="#A7B5B8" font-size="12" font-weight="400" text-anchor="start" >Keyboard focus</text><g id="control-4" data-layer="control-4"><rect x="792" y="151" width="164" height="44" rx="10" fill="#A7E2D2" /><text x="874.0" y="178" fill="#102721" font-size="15" font-weight="600" text-anchor="middle" >Open audio…</text></g><rect x="788" y="147" width="172" height="52" rx="13" fill="none" stroke="#F0F4F2" stroke-width="2"/><text x="48" y="268" fill="#A7B5B8" font-size="14" font-weight="400" text-anchor="start" >Selection uses a checkmark and color</text><rect x="48" y="295" width="216" height="53" rx="10" fill="#202B30" stroke="#76D6C0" /><text x="84" y="327" fill="#F0F4F2" font-size="14" font-weight="500" text-anchor="start" >Voice 1</text><g transform="translate(235,313) scale(0.7083333333333334)" fill="none" stroke="#F0F4F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><text x="48" y="399" fill="#A7B5B8" font-size="13" font-weight="400" text-anchor="start" >Use native focus, keyboard navigation and accessibility semantics.</text><text x="48" y="452" fill="#93A3A8" font-size="12" font-weight="400" text-anchor="start" >© GuerraMagica Audio</text></svg>